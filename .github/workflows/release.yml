name: Release

# main에 push될 때마다 manifest 버전을 읽어, 그 버전의 릴리스가 아직 없으면 만든다.
#  - HitomiWeb-extension-chromium.zip / HitomiWeb-extension-firefox.zip (서명 없음)
#  - AMO 키(secrets AMO_JWT_ISSUER / AMO_JWT_SECRET)가 있으면 Firefox용을 비공개(unlisted) 채널로 서명해
#    hitomi-web-firefox.xpi 와 updates.json 을 올린다. Firefox는 매니페스트의 update_url
#    (releases/latest/download/updates.json)로 새 버전을 스스로 찾아 설치한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version
        run: |
          set -euo pipefail
          v=$(node -p "require('./manifest.json').version")
          test "$v" = "$(node -p "require('./manifest.firefox.json').version")" || { echo "두 manifest 버전이 다릅니다" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "v$v 릴리스가 이미 있음 · 건너뜀"; fi

      - name: Package
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          rm -rf build out && mkdir -p build/chromium build/firefox out
          for f in background.js options.html options.js icons; do cp -r "$f" build/chromium/; cp -r "$f" build/firefox/; done
          cp manifest.json build/chromium/manifest.json
          cp manifest.firefox.json build/firefox/manifest.json
          (cd build/chromium && zip -qr -X ../../out/HitomiWeb-extension-chromium.zip .)
          (cd build/firefox && zip -qr -X ../../out/HitomiWeb-extension-firefox.zip .)

      - name: Sign for Firefox (AMO unlisted)
        if: env.SKIP != '1' && env.AMO_JWT_ISSUER != ''
        run: |
          set -euo pipefail
          npx --yes web-ext@8 sign --source-dir build/firefox --artifacts-dir signed --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --no-config-discovery
          xpi=$(ls signed/*.xpi | head -1); cp "$xpi" out/hitomi-web-firefox.xpi
          sha=$(sha256sum out/hitomi-web-firefox.xpi | cut -d' ' -f1)
          printf '{"addons":{"hitomi-web@lemminol.xyz":{"updates":[{"version":"%s","update_link":"https://github.com/%s/releases/download/v%s/hitomi-web-firefox.xpi","update_hash":"sha256:%s","applications":{"gecko":{"strict_min_version":"128.0"}}}]}}}\n' \
            "$VERSION" "$GH_REPO" "$VERSION" "$sha" > out/updates.json
          cat out/updates.json

      - name: Release
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          notes="Chromium: zip을 풀어 '압축해제된 확장 프로그램 로드'. Firefox: hitomi-web-firefox.xpi(서명됨)를 '파일에서 부가 기능 설치'. 자세한 설치법은 README."
          test -f out/hitomi-web-firefox.xpi || notes="$notes (이 릴리스에는 서명된 Firefox xpi가 없습니다: 저장소 Secrets에 AMO_JWT_ISSUER / AMO_JWT_SECRET 을 넣으면 다음 릴리스부터 만들어집니다.)"
          gh release create "v$VERSION" out/* --title "Hitomi Web 확장 $VERSION" --notes "$notes"
